<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick Your Path - Interactive Story</title>
  <script src="https://effecthouse.tiktok.com/gmes-2.0.4.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    #game-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      text-align: center;
    }
    #scene-image {
      width: 100%;
      aspect-ratio: 9/16;
      background: linear-gradient(180deg, #0f3460 0%, #1a1a2e 100%);
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 120px;
    }
    #story-text {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
    }
    #choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
      color: white;
    }
    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
    }
    .choice-btn:active {
      transform: translateY(0);
    }
    #progress {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    #ending-badge {
      display: none;
      font-size: 48px;
      margin-bottom: 20px;
    }
    #restart-btn {
      display: none;
      padding: 16px 32px;
      font-size: 18px;
      background: linear-gradient(135deg, #4ecca3 0%, #45b7aa 100%);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }
    #share-btn {
      display: none;
      padding: 16px 32px;
      font-size: 18px;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      margin-top: 12px;
      margin-left: 12px;
    }
    #ending-type {
      font-size: 14px;
      color: #4ecca3;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="progress">
    <div id="progress-bar" style="width: 0%"></div>
  </div>

  <div id="game-container">
    <div id="ending-badge"></div>
    <div id="ending-type"></div>
    <div id="scene-image">🐉</div>
    <div id="story-text">Loading...</div>
    <div id="choices"></div>
    <button id="restart-btn" onclick="restartGame()">Chơi Lại</button>
    <button id="share-btn" onclick="shareResult()">Chia sẻ</button>
  </div>

            { text: "⚔️ Tấn công lâu đài", next: "ending_ambush" },
            { text: "🤝 Xin diện kiến rồng", next: "ending_negotiate" }
          ]
        },
        light_torch: {
          emoji: "🔥",
          text: "Ngọn lửa soi sáng ngôi đền. Bạn thấy một cánh cửa bí ẩn...",
          choices: [
            { text: "🚪 Mở cánh cửa", next: "temple_enter" },
            { text: "⬇️ Quay về", next: "different_path" }
          ]
        },
        swim_across: {
          emoji: "🏊",
          text: "Dòng sông cuốn bạn xuôi dòng. Bạn thức dậy trên một bãi biển lạ!",
          choices: [
            { text: "🏝️ Khám phá bãi biển", next: "beach_explore" },
            { text: "🏃 Tìm đường về", next: "run_away" }
          ]
        },
        beach_explore: {
          emoji: "🏝️",
          text: "Trên bãi biển, bạn tìm thấy một con tàu đắm! Trong khoang tàu có một cây sáo vàng - có thể là vũ khí bí mật!",
          choices: [
            { text: "🎵 Cầm sáo đi tìm rồng", next: "ending_flute" },
            { text: "💎 Lấy vàng trong tàu", next: "ending_greed" }
          ]
        },
        ending_greed: {
          emoji: "💰",
          text: "Bạn lấy vàng và trở nên giàu có!Nhưng công chúa thì sao? Bạn đã quên mất!Cuối cùng bạn sống trong giàu sang nhưng với một chút áy náy...",
          ending: "GREED",
          endingTitle: " kẻ tham lam!"
        }
      }
    };

    // Game state
    let currentScene = STORY_CONFIG.startScene;
    let visitedScenes = new Set();
    let depth = 0;

    // Get current scene data
    function getCurrentScene() {
      return STORY_CONFIG.scenes[currentScene];
    }

    // Render the current scene
    function renderScene() {
      const scene = getCurrentScene();
      const emoji = document.getElementById('scene-image');
      const text = document.getElementById('story-text');
      const choices = document.getElementById('choices');
      const progressBar = document.getElementById('progress-bar');
      const restartBtn = document.getElementById('restart-btn');
      const shareBtn = document.getElementById('share-btn');
      const endingBadge = document.getElementById('ending-badge');
      const endingType = document.getElementById('ending-type');

      // Update progress
      const progress = Math.min((depth / STORY_CONFIG.maxDepth) * 100, 100);
      progressBar.style.width = progress + '%';

      // Check if ending
      if (scene.ending) {
        emoji.textContent = scene.emoji;
        text.textContent = scene.text;
        choices.innerHTML = '';
        endingBadge.style.display = 'block';
        endingBadge.textContent = scene.emoji;
        endingType.style.display = 'block';
        endingType.textContent = 'KẾT QUẢ: ' + scene.endingTitle;
        restartBtn.style.display = 'inline-block';
        shareBtn.style.display = 'inline-block';
        progressBar.style.width = '100%';

        // Save result for sharing
        localStorage.setItem('pickypath_result', JSON.stringify({
          ending: scene.ending,
          title: scene.endingTitle,
          depth: depth
        }));

        // Trigger TikTok share if available
        if (typeof GMEffect !== 'undefined') {
          GMEffect.setSharingConfig({
            title: 'Pick Your Path: ' + scene.endingTitle,
            message: 'Tôi đã trở thành ' + scene.endingTitle + ' trong Pick Your Path!'
          });
        }
        return;
      }

      // Regular scene
      emoji.textContent = scene.emoji;
      text.textContent = scene.text;
      choices.innerHTML = '';
      endingBadge.style.display = 'none';
      endingType.style.display = 'none';
      restartBtn.style.display = 'none';
      shareBtn.style.display = 'none';

      // Render choices
      scene.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = () => goToScene(choice.next);
        choices.appendChild(btn);
      });

      visitedScenes.add(currentScene);
    }

    // Navigate to a scene
    function goToScene(sceneId) {
      currentScene = sceneId;
      depth++;
      renderScene();
    }

    // Restart game
    function restartGame() {
      currentScene = STORY_CONFIG.startScene;
      visitedScenes.clear();
      depth = 0;
      renderScene();
    }

    // Share result
    function shareResult() {
      const result = JSON.parse(localStorage.getItem('pickypath_result') || '{}');
      if (navigator.share) {
        navigator.share({
          title: 'Pick Your Path: ' + result.title,
          text: 'Tôi đã trở thành ' + result.title + '!',
          url: window.location.href
        });
      } else {
        alert('Kết quả: ' + result.title + '\nHãy chia sẻ với bạn bè!');
      }
    }

    // Initialize game
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize TikTok Effect House SDK
      if (typeof GMEffect !== 'undefined') {
        GMEffect.init();
      }
      renderScene();
    });

    // For web preview
    renderScene();
  </script>
</body>
</html>
